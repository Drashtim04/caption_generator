services:
  - type: web
    name: caption-generator-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: meta-llama/llama-4-scout-17b-16e-instruct
      - key: GROQ_FALLBACK_VISION_MODEL
        value: meta-llama/llama-4-scout-17b-16e-instruct
      - key: MAX_UPLOAD_MB
        value: 10
